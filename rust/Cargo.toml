[workspace]
members = ["crates/otd-core", "crates/otd-platform", "crates/otd-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.60.2", features = [
  "Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_HumanInterfaceDevice", "Win32_Storage_FileSystem", "Win32_Storage_Xps",
  "Win32_System_IO", "Win32_System_Threading", "Win32_System_Console", "Win32_Security",
  "Win32_System_ProcessStatus", "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell"
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
