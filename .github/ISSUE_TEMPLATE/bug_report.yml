name: Bug Report
description: Create a bug report to help fix issues with OpenTabletDriver. If your tablet isn't detected, please make a support request instead.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Fill out the fields below adequately so that we have an easier time solving your issue. Thank you.

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide an example of the issue. Pictures, videos, or GIFs that showcase the issue are welcome.
      placeholder: |
        ex.
        1. Open bla bla window...
        2. Move tablet pen...
        3. Wait 5 seconds...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Explain what you expect to happen.
      placeholder: ex. So and so should have happened...
    validations:
      required: true

  - type: textarea
    id: observed-behavior
    attributes:
      label: Observed Behavior
      description: Explain what actually happens instead.
      placeholder: ex. So and so happened instead...
    validations:
      required: true

  - type: input
    id: tablet
    attributes:
      label: Tablet Device
      placeholder: ex. Wacom CTL-472
    validations:
      required: true

  - type: upload
    id: diagnostics
    attributes:
      label: Upload Diagnostic Information
      description: |
        Export diagnostics through the OpenTabletDriver GUI from menu <kbd>Help</kbd> → <kbd>Export Diagnostics</kbd>.
        Then, in the box below, attach the file. You can also use <kbd>Export Diagnostics to Clipboard</kbd> and save it to a file manually.

        **If you are not able to export diagnostics** for some reason (i.e., crashes), then retrieve logs for your platform following
        [these](https://opentabletdriver.net/Wiki/Documentation/Logs#daemon-log) instructions.
    validations:
      required: false
      accept: ".json"

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: |
        If you have anything else to add that could help diagnose the bug
      placeholder: |
        This bug prevents me from getting a diagnostics file, but I am using OpenTabletDriver v0.6.8 on Windows 11.
        -or-
        This started happening after updating my operating system.
        -or-
        Issue #1234 is unrelated to this issue because so and so...
        -or-
        This didn't happen before I upgraded my tablet firmware.
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: |
        Please make sure you are able to tick the items below, so that all parties involved have an easier time.
        Your issue is very likely to be closed and ignored if these conditions are not met.
      options:
        - label: I have installed OpenTabletDriver by following its [official installation instructions](https://opentabletdriver.net/).
        - label: I have checked the [OpenTabletDriver Wiki](https://opentabletdriver.net/Wiki) and respective FAQ pages, and my issue was not covered or actually fixed.
          required: true
        - label: I have searched the existing issues and this new issue is not a duplicate of any.
          required: true
        - label: I have written a concise and meaningful title.
          required: true
        - label: I am on the latest version of OpenTabletDriver.
          required: true
