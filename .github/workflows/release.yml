name: Release

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'The version suffix for this manual build.'
        required: false
  push:
    tags:
      - "v*"

jobs:
  nuget:
    runs-on: ubuntu-latest
    environment: nuget
    name: NuGet Deploy Release (Ubuntu Host)
    permissions:
      id-token: write # enable GitHub OIDC token issuance
    steps:
      - uses: actions/checkout@v6

      - name: NuGet login via OIDC / temp key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet package
        env:
          SOURCE: https://api.nuget.org/v3/index.json
        run: |
          dotnet pack --version-suffix "${{ inputs.version_suffix }}"
          dotnet nuget push ./nupkg/*.nupkg -s "$SOURCE" -k "${{steps.login.outputs.NUGET_API_KEY}}"

  matrixpublish:
    name: Build all supported platforms
    uses: ./.github/workflows/build-matrix.yml
    secrets: inherit
    with:
      version_suffix: ${{ inputs.version_suffix }}
